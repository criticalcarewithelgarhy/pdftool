name: pdftool
description: PDF Toolkit - Encrypt, Decrypt, Merge, Split PDFs
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_pdf: ^25.1.35
  file_picker: ^8.0.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.4
  share_plus: ^9.0.0
  open_filex: ^4.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#D32F2F"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: false

flutter_native_splash:
  color: "#D32F2F"
  image: assets/splash/splash_logo.png
  color_dark: "#D32F2F"
  image_dark: assets/splash/splash_logo.png
  android_12:
    image: assets/splash/splash_logo.png
    icon_background_color: "#D32F2F"
  fullscreen: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/splash/
